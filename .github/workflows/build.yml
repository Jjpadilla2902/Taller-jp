name: Compilar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Descomprimir y aplanar proyecto
      run: |
        unzip -o *.zip -d temp_extract
        DIR=$(find temp_extract -name "settings.gradle*" -printf '%h\n' | head -n 1)
        if [ -z "$DIR" ]; then
          echo "❌ No se encontró la carpeta del proyecto Android."
          exit 1
        fi
        mv $DIR/* .
        mv $DIR/.[!.]* . 2>/dev/null || true
        rm -rf temp_extract

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Preparar Gradle (Generar gradlew si falta)
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          echo "No se encontró gradlew, generando uno nuevo..."
          gradle wrapper
          chmod +x gradlew
        fi

    - name: Compilar con Gradle
      run: ./gradlew assembleDebug

    - name: Subir el APK
      uses: actions/upload-artifact@v4
      with:
        name: Taller-JP-APK
        path: app/build/outputs/apk/debug/app-debug.apk
