name: Compilar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Descomprimir y buscar proyecto
      run: |
        # Descomprime el zip en una carpeta
        unzip -o *.zip -d extract
        
        # Busca la carpeta que contiene el archivo gradlew
        DIR=$(find extract -name "gradlew" -type f -printf '%h\n' | head -n 1)
        
        # Si no lo encuentra, se detiene y muestra qué había adentro
        if [ -z "$DIR" ]; then
          echo "❌ ERROR: No se encontró el archivo 'gradlew'."
          echo "Revisa si el ZIP contiene los archivos de Android."
          ls -R extract
          exit 1
        fi
        
        # Guarda la ruta para los siguientes pasos
        echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
        echo "✅ Proyecto encontrado en: $DIR"

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dar permisos a Gradle
      run: chmod +x gradlew
      working-directory: ${{ env.PROJECT_DIR }}

    - name: Compilar con Gradle
      run: ./gradlew assembleDebug
      working-directory: ${{ env.PROJECT_DIR }}

    - name: Subir el APK
      uses: actions/upload-artifact@v4
      with:
        name: Taller-JP-APK
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
