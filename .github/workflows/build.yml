name: Compilar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Descomprimir proyecto
      run: |
        unzip -o *.zip
        rm *.zip

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dar permisos a Gradle
      run: find . -name "gradlew" -exec chmod +x {} \;

    - name: Compilar con Gradle
      run: |
        find . -name "gradlew" -execdir ./gradlew assembleDebug \;

    - name: Subir el APK
      uses: actions/upload-artifact@v4
      with:
        name: Taller-JP-APK
        path: "**/build/outputs/apk/debug/app-debug.apk"
