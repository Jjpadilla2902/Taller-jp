name: Compilar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Descomprimir y aplanar proyecto
      run: |
        unzip -o *.zip -d temp_extract
        rm *.zip
        PROJECT_DIR=$(find temp_extract -name gradlew -printf '%h\n' | head -n 1)
        mv $PROJECT_DIR/* .
        mv $PROJECT_DIR/.[!.]* . 2>/dev/null || true
        rm -rf temp_extract

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dar permisos a Gradle
      run: chmod +x gradlew

    - name: Compilar con Gradle
      run: ./gradlew assembleDebug

    - name: Subir el APK
      uses: actions/upload-artifact@v4
      with:
        name: Taller-JP-APK
        path: app/build/outputs/apk/debug/app-debug.apk
